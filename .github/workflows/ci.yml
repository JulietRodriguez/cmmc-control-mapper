name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # NIST OSCAL v1.1.2 Component Definition schema, pinned by SHA-256.
  OSCAL_SCHEMA_URL: https://github.com/usnistgov/OSCAL/releases/download/v1.1.2/oscal_component_schema.json
  OSCAL_SCHEMA_SHA256: 7b74710940ad39b6b63d4ddccbadf2c7d2e9bf11b07808d41d2aa27a4616e5ce

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff jsonschema

      - name: Lint
        run: ruff check src/ cli.py tests/ tools/

      - name: Check data file is up to date with its sources
        run: |
          python tools/build_controls.py
          git diff --exit-code data/cmmc_controls.json

      - name: Download OSCAL schema
        run: |
          mkdir -p schemas
          curl -sSfL "$OSCAL_SCHEMA_URL" -o schemas/oscal_component_schema.json
          echo "$OSCAL_SCHEMA_SHA256  schemas/oscal_component_schema.json" | sha256sum -c -

      - name: Test
        run: pytest tests/ -v

      - name: Validate OSCAL export against the official schema
        run: |
          python cli.py export --level 2 --output /tmp/cmmc_l2.json
          python cli.py export --level 1 --output /tmp/cmmc_l1.json
          python tools/validate_oscal.py --schema schemas/oscal_component_schema.json /tmp/cmmc_l2.json /tmp/cmmc_l1.json
